name: Check fork change scope

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-fork-scope:
    name: Fork change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: check-paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import html
          import json
          import os
          import subprocess
          from pathlib import Path, PurePosixPath

          allowed_prefixes = (
              "ui/",
              "ai_platform_engineering/agents/tome/",
              "docs/",
          )
          allowed_files = (
              ".github/workflows/check-fork-scope.yml",
          )

          # Check the full PR diff. Disable rename detection so both the old
          # and new paths are checked, including moves into an allowed folder.
          changed = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z",
              f"{os.environ['PR_BASE_SHA']}...{os.environ['PR_HEAD_SHA']}", "--",
          ])
          paths = [os.fsdecode(path) for path in changed.split(b"\0") if path]
          violations = sorted(
              path for path in paths
              if not path.startswith(allowed_prefixes) and path not in allowed_files
          )

          report = ["## Fork change scope", ""]
          if violations:
              message = (
                  "File changes in the folders below detected. "
                  "Please upstream these changes first and remove them from this PR."
              )
              folders = sorted({
                  str(PurePosixPath(path).parent) + "/"
                  if "/" in path else "(repository root)"
                  for path in violations
              })
              report.extend([
                  message,
                  "",
                  "Upstream: https://github.com/caipe-io/ai-platform-engineering",
                  "",
                  "### Affected folders",
                  "",
              ])
              report.extend(f"- <code>{html.escape(json.dumps(folder))}</code>" for folder in folders)
              report.extend(["", "### Changed files outside the allowed folders", ""])
              report.extend(f"- <code>{html.escape(json.dumps(path))}</code>" for path in violations)
              print(f"::error::{message}")
              print("Affected folders:")
              for folder in folders:
                  print(f"  - {json.dumps(folder)}")
              print("Changed files:")
              for path in violations:
                  print(f"  - {json.dumps(path)}")
          else:
              message = "All changed files are within the allowed folders."
              report.append(message)
              print(message)

          report.extend(["", "### Allowed folders", ""])
          report.extend(f"- `{prefix}`" for prefix in allowed_prefixes)
          report.extend(["", "### Allowed files", ""])
          report.extend(f"- `{path}`" for path in allowed_files)
          report_text = "\n".join(report) + "\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(report_text)
          if violations:
              (Path(os.environ["RUNNER_TEMP"]) / "fork-scope-report.md").write_text(
                  report_text, encoding="utf-8"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as outputs:
              outputs.write(f"violations_found={str(bool(violations)).lower()}\n")

          raise SystemExit(1 if violations else 0)

      - name: Comment on PR with scope violations
        if: failure() && steps.check-paths.outputs.violations_found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- fork-change-scope:${context.payload.pull_request.head.sha} -->`;
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/fork-scope-report.md`, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            if (!comments.some(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )) {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: `${marker}\n${report}`
              });
            }
