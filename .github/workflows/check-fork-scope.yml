name: Check fork change scope

on:
  # Never execute the PR's proposed verifier/workflow with a write token.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-fork-scope:
    name: Fork change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base history and verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR objects without checking out PR files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Scope authentication to this private-repository fetch; never
          # persist credentials or send this header to public upstream.
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/fork-scope/pr-head"
          if [[ "$(git rev-parse refs/remotes/fork-scope/pr-head)" != "$PR_HEAD_SHA" ]]; then
            echo '::error::PR head changed during verification. Run the check for the latest commit.'
            exit 1
          fi

      - name: Fetch official upstream main
        shell: bash
        run: |
          git -c credential.helper= fetch --no-tags --no-recurse-submodules \
            https://github.com/caipe-io/ai-platform-engineering.git \
            +refs/heads/main:refs/remotes/upstream-scope/main

      - name: Verify upstream imports and fork-only paths
        id: check-paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_fork_scope.py

      - name: Comment on PR with scope violations
        if: failure() && steps.check-paths.outputs.violations_found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- fork-change-scope:${context.payload.pull_request.head.sha} -->`;
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/fork-scope-report.md`, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            if (!comments.some(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )) {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: `${marker}\n${report}`
              });
            }
