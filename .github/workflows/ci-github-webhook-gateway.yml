name: "[CI] GitHub Webhook Gateway Build"

on:
  push:
    tags:
      - "**"
  pull_request:
    paths:
      - "integrations/github-webhook-gateway/**"
      - ".github/workflows/ci-github-webhook-gateway.yml"
  workflow_dispatch:
    inputs:
      tag_version:
        description: "Version tag to apply (for example, 0.0.1)"
        required: false
        type: string
      repo_org:
        description: "GitHub organization/user that owns the GHCR package"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.repo_org || github.repository_owner }}/github-webhook-gateway
  DOCKERFILE: integrations/github-webhook-gateway/Dockerfile

jobs:
  test:
    name: Test gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check boto3

      - name: Run unit tests
        working-directory: integrations/github-webhook-gateway/app
        run: python -m unittest -v test_app.py

  build:
    name: Build gateway image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag_version }},enable=${{ inputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Build and publish gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: integrations/github-webhook-gateway
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

  mirror-to-ecr:
    name: Mirror github-webhook-gateway to ECR
    needs: build
    if: >-
      needs.build.result == 'success' &&
      (inputs.tag_version != '' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: cisco-eti/gh-reusable-workflows/.github/workflows/mirror-ghcr-to-ecr.yaml@d262b86f89f00ffc0c03814d8a971757d9c52f46
    with:
      image-path: ${{ inputs.repo_org || github.repository_owner }}/github-webhook-gateway
      image-tag: ${{ inputs.tag_version || github.ref_name }}
    secrets:
      vault-approle-role-id: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
      vault-approle-secret-id: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
