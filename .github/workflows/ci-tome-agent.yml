name: "[CI] Tome Agent Build and Push"

on:
  push:
    tags:
      - '**-dev.*'
  pull_request:
    paths:
      - "ai_platform_engineering/agents/tome/**"
      - ".github/workflows/ci-tome-agent.yml"
  workflow_dispatch:
    inputs:
      tag_version:
        description: "Coordinated Tome image tag"
        required: true
        type: string
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      repo_org:
        description: "GitHub organization/user that owns the GHCR package"
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ inputs.repo_org || github.repository_owner }}/caipe-tome-agent
  DOCKERFILE: ai_platform_engineering/agents/tome/Dockerfile
  LOCAL_IMAGE: caipe-tome-agent:ci
  TAG_VERSION: ${{ inputs.tag_version || github.ref_name }}

jobs:
  smoke-test:
    name: Smoke test tome-agent
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build local tome-agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ai_platform_engineering/agents/tome
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

      - name: Start tome-agent
        run: |
          docker run -d \
            --name tome-agent-smoke \
            -p 127.0.0.1:8766:8766 \
            -e ANTHROPIC_API_KEY=smoke-test-placeholder \
            -e TTT_AGENT_TOKEN=dev \
            "${LOCAL_IMAGE}"

      - name: Check /healthz
        run: |
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8766/healthz; then
              echo
              echo "tome-agent health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "tome-agent health check failed"
          docker logs tome-agent-smoke || true
          exit 1

      - name: Stop tome-agent
        if: always()
        run: docker rm -f tome-agent-smoke || true

  publish:
    name: Publish tome-agent image
    runs-on: ubuntu-latest
    needs: smoke-test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-chart.'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TAG_VERSION }}

      - name: Build and push tome-agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ai_platform_engineering/agents/tome
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ inputs.source_sha || github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

  mirror-to-ecr:
    name: Mirror caipe-tome-agent to ECR
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      (inputs.tag_version != '' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: cisco-eti/gh-reusable-workflows/.github/workflows/mirror-ghcr-to-ecr.yaml@fce663497d58691f824fedc4eed62dcdf38a20a8
    with:
      image-path: ${{ inputs.repo_org || github.repository_owner }}/caipe-tome-agent
      image-tag: ${{ inputs.tag_version || github.ref_name }}
    secrets:
      vault-approle-role-id: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
      vault-approle-secret-id: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
