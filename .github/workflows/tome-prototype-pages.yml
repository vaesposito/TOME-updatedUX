# Publish the TOME interface prototype to GitHub Pages.
#
# The prototype is the real screens exported as files, with the API answered
# from fixtures. It has no server and no data, so there is nothing to
# configure and nothing to protect: the build is the whole deployment.
name: TOME prototype (Pages)

on:
  push:
    branches: [notification-ux]
    paths:
      - "ui/**"
      - ".github/workflows/tome-prototype-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push win rather than queue.
concurrency:
  group: tome-prototype-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Build the prototype
        # Pages serves a project site from a subdirectory, so the export has
        # to be told the prefix its own links will be reached under.
        env:
          PROTOTYPE_BASE_PATH: /${{ github.event.repository.name }}
        run: npx next build prototype

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/prototype/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
